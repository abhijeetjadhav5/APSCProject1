<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {
  font-family: Arial, Helvetica, sans-serif;
  background-color: black;
}

* {
  box-sizing: border-box;
}

/* Add padding to containers */
.container {
  padding: 16px;
  background-color: white;
}

/* Full-width input fields */
input[type=text], input[type=password],input[type=number] {
  width: 100%;
  padding: 15px;
  margin: 5px 0 22px 0;
  display: inline-block;
  border: none;
  background: #f1f1f1;
}
select{
    width: 100%;
  padding: 15px;
  margin: 5px 0 22px 0;
  display: inline-block;
  border: none;
  background: #f1f1f1;
}


input[type=text]:focus, input[type=password]:focus {
  background-color: #ddd;
  outline: none;
}

/* Overwrite default styles of hr */
hr {
  border: 1px solid #f1f1f1;
  margin-bottom: 25px;
}

/* Set a style for the submit button */
.registerbtn {
  background-color: #04AA6D;
  color: white;
  padding: 16px 20px;
  margin: 8px 0;
  border: none;
  cursor: pointer;
  width: 100%;
  opacity: 0.9;
}

.registerbtn:hover {
  opacity: 1;
}

/* Add a blue text color to links */
a {
  color: dodgerblue;
}

/* Set a grey background color and center the text of the "sign in" section */
.signin {
  background-color: #f1f1f1;
  text-align: center;
}
</style>
</head>
<body>

<form action="/action_page.php">
  <div class="container">
    <h1>Registration</h1>
    <p>Register as</p>
    <hr>
    <label for="cars">Role</label>

<select name="Role" id="role">
        <option value="admin">admin</option>
        <option value="farmer">farmer</option>
        <option value="user">user</option>
    </select>
<br><br>
    <label for="aadhar"><b>aadhar card no.</b></label>
    <input type="number" placeholder="aadhar card no." name="aadhar" id="aadhar" required>

    <label for="name"><b>name</b></label>
    <input type="text" placeholder="Full name" name="name" id="name" required>

    <label for="validate"><b>validate</b></label>
    <input type="number" placeholder="validate" name="validate" id="validate" required>
    <hr>
    <label for="Gender"><b>Gender</b></label>
    <select name="Gender" id="gender">
        <option value="male">male</option>
        <option value="female">female</option>
        <option value="other">other</option>
    </select>
    <br><br>
     <label for="contact"><b>Mob No.</b></label>
    <input type="number" placeholder="Mob No." name="contact" id="contact" required>

    <label for="address"><b>address</b></label>
    <input type="text" placeholder="address" name="address" id="address" required>

    <label for="dob"><b>Date of birth</b></label>
    <input type="date" placeholder="date of birth" name="dob" id="dob" required>
    <button type="submit" class="registerbtn">Register</button>

  </div>
  
  
</form>
<script src="script.js"></script>
</body>
</html>
